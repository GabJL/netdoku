<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Icono de Netdoku: tablero 3×3 con tres redes, un router en una frontera y un paquete. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#2e3440"/>
  <!-- Redes: ámbar (arriba a la izquierda), azul (columna derecha), verde (abajo). -->
  <path d="M4 4H20V12H12V20H4Z" fill="#f3d9a4"/>
  <path d="M20 4H28V28H20Z" fill="#bcd6f2"/>
  <path d="M12 12H20V28H4V20H12Z" fill="#c5e3c6"/>
  <!-- Líneas de casilla -->
  <path d="M12 4V12M4 12H12M24 4V28M20 20H28M20 12H28M12 20V28M12 20H20" stroke="#2e3440" stroke-opacity="0.18" stroke-width="0.6"/>
  <!-- Fronteras entre redes -->
  <path d="M20 4V28M12 12H20M12 12V20M4 20H12" stroke="#2e3440" stroke-width="1.8" stroke-linecap="square"/>
  <!-- Router en la frontera entre ámbar y azul -->
  <circle cx="20" cy="8" r="3" fill="#1f4e9a" stroke="#fff" stroke-width="1"/>
  <path d="M18.6 7.2H21.4M20.6 6.4L21.4 7.2L20.6 8M21.4 8.8H18.6M19.4 8L18.6 8.8L19.4 9.6" stroke="#fff" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paquete -->
  <circle cx="16" cy="24" r="3.4" fill="#e05a47" stroke="#fff" stroke-width="1"/>
</svg>
