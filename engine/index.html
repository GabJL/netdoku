<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netdoku</title>
  <link rel="stylesheet" href="netdoku.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><img src="icon.svg" alt="" width="30" height="30">Netdoku</h1>
    <nav class="level-nav" aria-label="Niveles">
      <button id="level-prev" class="icon-button" type="button" title="Nivel anterior" aria-label="Nivel anterior">‹</button>
      <select id="level-select" class="pill-select" aria-label="Nivel"></select>
      <button id="level-next" class="icon-button" type="button" title="Nivel siguiente" aria-label="Nivel siguiente">›</button>
      <button id="restart" class="icon-button" type="button" title="Reiniciar el nivel" aria-label="Reiniciar el nivel">↺</button>
    </nav>
    <div id="appearance-controls" class="appearance-controls"></div>
    <div id="lives" class="lives" aria-label="Vidas"></div>
  </header>

  <main class="layout">
    <aside class="help-panel" aria-label="Ayuda del nivel">
      <div class="help-head">
        <h2>Ayuda</h2>
        <a class="icon-button" href="ayuda.html" target="_blank" rel="noopener" title="Abrir la ayuda completa" aria-label="Ayuda completa">?</a>
      </div>
      <p id="objective" class="objective"></p>
      <div id="help-groups"></div>
      <section class="help-group">
        <h3>Redes</h3>
        <div id="legend" class="legend"></div>
      </section>
    </aside>

    <section class="board-area">
      <div id="board-wrap" class="board-wrap"></div>
    </section>

    <aside class="side">
      <label class="modebar" title="Atajo: tecla A">
        <input type="checkbox" id="note-mode" role="switch">
        <span class="switch" aria-hidden="true"></span>
        <span id="mode-label">Modo colocar</span>
      </label>
      <div id="message" class="message" role="status"></div>
      <div id="final" class="final" hidden></div>
      <div id="packets" class="packets"></div>
    </aside>
  </main>

  <div id="drag-ghost" class="token ghost" hidden></div>

  <dialog id="help-dialog" class="help-dialog">
    <button type="button" class="close" aria-label="Cerrar">✕</button>
    <div class="help-body"></div>
  </dialog>

  <script src="help.js"></script>
  <script src="netdoku.js"></script>
</body>
</html>
